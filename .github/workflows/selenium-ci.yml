name: Selenium Naukri Pytest Automation CI/CD (BrowserStack)

on:
  push:
    branches:
      - main
      - naukari_automation_ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r utils/requirements.txt
        pip install webdriver-manager

    - name: Run Selenium Tests on BrowserStack
      env:
        BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
        BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      run: |
        echo "Running tests on BrowserStack..."
        pytest -v tests/ --html=report.html

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browserstack-report
        path: report.html
