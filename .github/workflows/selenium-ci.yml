name: Selenium Naukari Pytest Automation CI/CD

on:
  push:
    branches:
      - main
      - naukari_automation_ci   # Your clean CI branch
  pull_request:
    branches:
      - main
  workflow_dispatch:        # manual trigger button
  schedule:
    - cron: "0 */6 * * *"   # run every 6 hours

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"   # Selenium recommended stable version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r utils/requirements.txt
        pip install webdriver-manager

    - name: Run Selenium Login Test Only   # debugging only login
      env:
        BROWSER: ${{ matrix.browser }}
      run: |
        echo "Running LOGIN test on $BROWSER"
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest -v tests/test_login.py --html=report.html

    - name: Upload HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: login-html-report-${{ matrix.browser }}
        path: report.html
