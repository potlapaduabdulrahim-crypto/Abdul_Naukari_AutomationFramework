name: Selenium Naukari Pytest Automation CI/CD

on:
  push:
    branches:
      - main
      - Abdul_NaukariAutomation_CiCD   # enable CI on your branch
  pull_request:
    branches:
      - main
  workflow_dispatch:      # allows manual run from UI

  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r utils/requirements.txt
        pip install webdriver-manager

    - name: Run Selenium Tests
      env:
        BROWSER: ${{ matrix.browser }}
      run: |
        echo "Running tests on $BROWSER"
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest -n 4 -v tests/ --html=report.html

    - name: Upload HTML Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-report-${{ matrix.browser }}
        path: report.html
